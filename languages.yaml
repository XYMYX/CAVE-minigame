# Richtungswörter für den Chat.
# Niederländisch ist schon dabei: dort heißt es wie im Deutschen links/rechts.
# Dänisch "venstre" teilt sich den Eintrag mit dem Norwegischen.
#
# So fügst du eine Sprache hinzu:
#   1. Unter left oder right einen Eintrag ergänzen.
#   2. "word" ist das Wort, das der Zuschauer schreibt.
#   3. "lang" ist nur eine Notiz für dich (de, en, fr, ...).
#   4. Spiel neu starten. Die Tests prüfen, dass jedes Wort noch
#      auf genau eine Richtung zeigt.
#
# Groß/Klein und viele Akzente sind egal: "LINKS", "links" und "vänster"
# werden vor dem Vergleich vereinheitlicht.
#
# whole_message: true
#   Kurze, mehrdeutige Kürzel zählen nur, wenn die GANZE Nachricht
#   genau dieses Kürzel ist. "l" lenkt also nach links, "hallo l" nicht.
#   So wird aus "brilliant" nicht aus Versehen "r" oder "right".
#   Gilt auch für Wörter, die in anderen Sprachen etwas anderes heissen:
#   Türkisch "sag" soll in "sag mal" keine Stimme sein.
#
# Ohne whole_message zählt das Wort, wenn es als eigenes Wort vorkommt.
# "go left now" zählt. "leftover" zählt nicht.
#
# Chinesisch, Japanisch (Kanji): ein einzelnes Zeichen wie 左 zählt,
# wenn die ganze Nachricht dieses Zeichen ist oder es als eigenes
# Stück zwischen Leerzeichen steht. In "今日は左" steckt 左 in einem
# längeren Wort und zählt absichtlich NICHT.

hints:
  # Kurze Wörter, die unten im Bild der Reihe nach erscheinen.
  - links
  - left
  - gauche
  - izquierda
  - esquerda
  - sinistra
  - lewo
  - sol
  - "лево"
  - "ліво"
  - vänster
  - venstre
  - vasen
  - vlevo
  - stânga
  - "αριστερά"
  - "يسار"
  - "बाएँ"
  - "左"
  - "ひだり"
  - "왼쪽"
  - kiri
  - trái
  - "ซ้าย"
  - "←"

# Diese Zeichen zählen auch mitten im Text als eigene Markierung,
# zum Beispiel "go →". "<" und ">" stehen hier nicht: die sind
# zu häufig ("<3") und gelten nur als ganze Nachricht, siehe unten.
symbols:
  left:
    - "←"
    - "⬅"
    - "⬅️"
    - "👈"
    - "◀"
    - "◄"
  right:
    - "→"
    - "➡"
    - "➡️"
    - "👉"
    - "▶"
    - "►"

# "<" und ">" nur, wenn die Nachricht aus nichts anderem besteht.
# ">>>" zählt trotzdem, "<3" nicht.
whole_message_symbols:
  left: ["<", "‹"]
  right: [">", "›"]

left:
